<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>QR Maker</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <header>
    <h1>QR Maker</h1>
  </header>

  <main>
    <div class="field">
      <input
        id="input"
        type="text"
        inputmode="url"
        placeholder="https://example.com"
        autocomplete="off"
        autocapitalize="off"
        spellcheck="false"
        aria-label="QRコードにするURL"
        autofocus>
    </div>

    <div class="qr-wrap">
      <canvas id="canvas" hidden></canvas>
      <p class="note" id="note">URLを貼るとQRコードが出ます</p>
    </div>

    <div class="controls">
      <div class="control-row">
        <span class="control-label">粒</span>
        <div class="segmented" id="shape-group" role="radiogroup" aria-label="粒の形">
          <button type="button" class="seg" data-shape="square" role="radio" aria-checked="true">四角</button>
          <button type="button" class="seg" data-shape="round"  role="radio" aria-checked="false">角丸</button>
          <button type="button" class="seg" data-shape="dot"    role="radio" aria-checked="false">ドット</button>
        </div>
      </div>

      <div class="control-row">
        <span class="control-label">色</span>
        <label class="swatch">
          <input type="color" id="fg-input" value="#000000">
          <span>前景</span>
        </label>
        <label class="swatch">
          <input type="color" id="bg-input" value="#ffffff">
          <span>背景</span>
        </label>
        <span class="contrast" id="contrast" title="明暗の差。数字が大きいほど読み取りやすい"></span>
        <button type="button" class="reset-btn" id="reset-btn">戻す</button>
      </div>

      <p class="warn" id="warn" hidden></p>
    </div>

    <button id="download-btn" disabled>PNGで保存</button>
  </main>

  <footer>
    <p class="privacy">
      QRコードはこのページの中だけで作っています。入力した内容がどこかへ送られることはありません。
      生成にはオープンソースの<a href="https://github.com/kazuhikoarase/qrcode-generator" target="_blank" rel="noopener noreferrer">qrcode-generator</a>（MIT License）を同梱して使っています。
    </p>
    <a class="repo-link" href="https://github.com/daaaaaai/qrcode_maker" target="_blank" rel="noopener noreferrer">GitHub</a>
  </footer>

  <script src="./qrcode.min.js"></script>
  <script src="./app.js"></script>
</body>
</html>
